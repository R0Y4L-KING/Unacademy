<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Unacademy — Choose Your Portal</title>
<meta name="description" content="Unacademy portals — pick a portal to continue." />
<meta name="theme-color" content="#0a0f1a" />
<link rel="icon" href="logo.png" type="image/png" />
<link rel="apple-touch-icon" href="logo.png" />
<style>
  :root {
    --bg: #070b12;
    --bg-2: #0d1522;
    --card: rgba(255, 255, 255, .045);
    --card-hi: rgba(255, 255, 255, .085);
    --line: rgba(255, 255, 255, .10);
    --txt: #eef3fb;
    --dim: #93a4bd;
    --radius: 20px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background:
      radial-gradient(1100px 620px at 12% -10%, #12233d 0%, transparent 60%),
      radial-gradient(900px 560px at 92% 8%, #2a1440 0%, transparent 62%),
      radial-gradient(800px 520px at 50% 118%, #0b2c33 0%, transparent 60%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
    color: var(--txt);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
      "Helvetica Neue", Arial, sans-serif;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 26px 18px 34px;
    overflow-x: hidden;
  }

  /* ---------- floating glow ---------- */
  .blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(90px);
    opacity: .45;
    pointer-events: none;
    z-index: 0;
    animation: float 14s ease-in-out infinite alternate;
  }
  .blob.a { width: 320px; height: 320px; background: #1f6feb; top: -90px; left: -80px; }
  .blob.b { width: 280px; height: 280px; background: #a855f7; bottom: -80px; right: -70px; animation-delay: -5s; }
  @keyframes float {
    from { transform: translate3d(0, 0, 0) scale(1); }
    to   { transform: translate3d(24px, -26px, 0) scale(1.12); }
  }

  /* ---------- splash ---------- */
  #splash {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: grid;
    place-items: center;
    background: radial-gradient(700px 500px at 50% 40%, #101d31 0%, #070b12 70%);
    transition: opacity .55s ease, visibility .55s ease;
  }
  #splash.hide { opacity: 0; visibility: hidden; }

  .splash-inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    animation: pop .7s cubic-bezier(.2, .8, .25, 1) both;
  }
  @keyframes pop {
    from { opacity: 0; transform: translateY(14px) scale(.94); }
    to   { opacity: 1; transform: none; }
  }

  .ring {
    position: relative;
    width: 132px;
    height: 132px;
    display: grid;
    place-items: center;
  }
  .ring::before,
  .ring::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 2px solid transparent;
  }
  .ring::before {
    border-top-color: #38e8ff;
    border-right-color: #38e8ff;
    animation: spin 1.15s linear infinite;
  }
  .ring::after {
    inset: 14px;
    border-bottom-color: #a855f7;
    border-left-color: #a855f7;
    animation: spin 1.7s linear infinite reverse;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .splash-logo {
    width: 74px;
    height: 74px;
    object-fit: contain;
    filter: drop-shadow(0 10px 26px rgba(66, 133, 244, .45));
    animation: breathe 2.2s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }

  .splash-name {
    font-size: 19px;
    font-weight: 700;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: #dfeaf8;
  }
  .splash-sub {
    font-size: 12.5px;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: #6d8099;
  }

  .bar {
    width: 168px;
    height: 4px;
    border-radius: 99px;
    background: rgba(255, 255, 255, .09);
    overflow: hidden;
    margin-top: 4px;
  }
  .bar > i {
    display: block;
    height: 100%;
    width: 40%;
    border-radius: 99px;
    background: linear-gradient(90deg, #38e8ff, #a855f7);
    animation: slide 1.25s ease-in-out infinite;
  }
  @keyframes slide {
    0%   { transform: translateX(-110%); }
    100% { transform: translateX(310%); }
  }

  /* ---------- content ---------- */
  .wrap {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 560px;
  }

  .head { text-align: center; margin-bottom: 22px; }

  .brand-logo {
    width: 88px;
    height: 88px;
    margin: 0 auto 12px;
    display: block;
    object-fit: contain;
    filter: drop-shadow(0 14px 34px rgba(66, 133, 244, .35));
  }

  h1 {
    margin: 0 0 6px;
    font-size: clamp(24px, 6vw, 30px);
    font-weight: 800;
    letter-spacing: -.02em;
  }
  .sub { margin: 0; color: var(--dim); font-size: 14px; }

  .portals { display: grid; gap: 12px; }

  .portal {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 15px 16px;
    border-radius: var(--radius);
    background: var(--card);
    border: 1px solid var(--line);
    color: inherit;
    text-decoration: none;
    position: relative;
    overflow: hidden;
    transition: transform .18s ease, background .18s ease, border-color .18s ease;
    opacity: 0;
    transform: translateY(14px);
  }
  .portal::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(220px 90px at 0% 50%, var(--glow, transparent), transparent 70%);
    opacity: .85;
    pointer-events: none;
  }
  .portal:active { transform: scale(.985); }
  .portal:hover { background: var(--card-hi); border-color: rgba(255, 255, 255, .2); }

  .portal.in { animation: rise .5s cubic-bezier(.2, .8, .25, 1) forwards; }
  @keyframes rise { to { opacity: 1; transform: none; } }

  .chip {
    flex: 0 0 auto;
    width: 46px;
    height: 46px;
    border-radius: 13px;
    display: grid;
    place-items: center;
    font-size: 11.5px;
    font-weight: 800;
    letter-spacing: .02em;
    color: var(--tint, #fff);
    background: rgba(255, 255, 255, .08);
    background: color-mix(in srgb, var(--tint, #fff) 16%, transparent);
    border: 1px solid color-mix(in srgb, var(--tint, #fff) 34%, transparent);
    z-index: 1;
  }

  .texts { display: flex; flex-direction: column; gap: 2px; min-width: 0; z-index: 1; }
  .label { font-size: 15.5px; font-weight: 700; letter-spacing: -.01em; }
  .meta { font-size: 12.5px; color: var(--dim); }

  .chev {
    margin-left: auto;
    font-size: 24px;
    line-height: 1;
    color: var(--dim);
    z-index: 1;
  }

  /* ---------- footer ---------- */
  .foot {
    margin-top: 24px;
    text-align: center;
    font-size: 12.5px;
    color: #6d8099;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .foot b { color: #a9bcd6; font-weight: 600; }

  /* dhadakta hua dil — real heartbeat jaisa double thump */
  .heart {
    display: inline-block;
    font-size: 15px;
    transform-origin: center;
    animation: heartbeat 1.5s ease-in-out infinite;
  }
  @keyframes heartbeat {
    0%   { transform: scale(1); }
    14%  { transform: scale(1.32); }
    28%  { transform: scale(1); }
    42%  { transform: scale(1.22); }
    56%  { transform: scale(1); }
    100% { transform: scale(1); }
  }

  @media (min-width: 620px) {
    .portals { grid-template-columns: 1fr 1fr; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .001ms !important;
    }
    .portal { opacity: 1; transform: none; }
  }
</style>
</head>
<body>

  <div class="blob a"></div>
  <div class="blob b"></div>

  <!-- Splash -->
  <div id="splash" role="status" aria-label="Loading">
    <div class="splash-inner">
      <div class="ring">
        <img class="splash-logo" src="logo.png" alt="" />
      </div>
      <div class="splash-name">Unacademy</div>
      <div class="splash-sub">Choose your portal</div>
      <div class="bar"><i></i></div>
    </div>
  </div>

  <!-- Content -->
  <main class="wrap">
    <header class="head">
      <img class="brand-logo" src="logo.png" alt="Unacademy logo" />
      <h1>Unacademy</h1>
      <p class="sub">Pick a portal to continue</p>
    </header>

    <nav class="portals">
      <a class="portal" style="--tint:#fbbf24; --glow:rgba(251,191,36,.16)"
         href="https://studyuk.online/">
        <span class="chip">ADS</span>
        <span class="texts">
          <span class="label">Unacademy (Ads)</span>
          <span class="meta">Ad-supported portal</span>
        </span>
        <span class="chev" aria-hidden="true">&rsaquo;</span>
      </a>

      <a class="portal" style="--tint:#38e8ff; --glow:rgba(56,232,255,.16)"
         href="https://uc-web.uc27.workers.dev/">
        <span class="chip">V1</span>
        <span class="texts">
          <span class="label">Unacademy V1</span>
          <span class="meta">Primary portal</span>
        </span>
        <span class="chev" aria-hidden="true">&rsaquo;</span>
      </a>

      <a class="portal" style="--tint:#34d399; --glow:rgba(52,211,153,.16)"
         href="https://stream.nexthope.sbs/uncoffline/">
        <span class="chip">OFF</span>
        <span class="texts">
          <span class="label">Unacademy Offline</span>
          <span class="meta">Offline batches</span>
        </span>
        <span class="chev" aria-hidden="true">&rsaquo;</span>
      </a>

      <a class="portal" style="--tint:#f472b6; --glow:rgba(244,114,182,.16)"
         href="https://stream.nexthope.sbs/unacademy/">
        <span class="chip">ON</span>
        <span class="texts">
          <span class="label">Unacademy Online</span>
          <span class="meta">Online batches</span>
        </span>
        <span class="chev" aria-hidden="true">&rsaquo;</span>
      </a>
    </nav>

    <p class="foot">
      Made with <span class="heart" aria-label="love">❤️</span> by <b>EduAppsKing</b>
    </p>
  </main>

<script>
  (function () {
    var splash = document.getElementById('splash');
    var cards = Array.prototype.slice.call(document.querySelectorAll('.portal'));

    function revealCards() {
      cards.forEach(function (el, i) {
        setTimeout(function () { el.classList.add('in'); }, i * 70);
      });
    }

    var reduce = window.matchMedia &&
      window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    if (reduce) {
      splash.classList.add('hide');
      cards.forEach(function (el) { el.classList.add('in'); });
      return;
    }

    var finished = false;
    function done() {
      if (finished) return;
      finished = true;
      splash.classList.add('hide');
      revealCards();
      setTimeout(function () {
        if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
      }, 700);
    }

    var MIN_SHOW = 1500;
    var started = Date.now();

    window.addEventListener('load', function () {
      var wait = Math.max(0, MIN_SHOW - (Date.now() - started));
      setTimeout(done, wait);
    });

    setTimeout(done, 4000);
  })();
</script>
</body>
</html>
